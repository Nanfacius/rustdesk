name: Build iOS ipa (patched, unsigned)

# Standalone, manually triggered iOS build.
#
# Based on the `build-rustdesk-ios` job of `flutter-build.yml`, with two changes:
#   * `flutter build ipa --no-codesign` only produces an .xcarchive, never an
#     .ipa - which is presumably why upstream's upload steps are commented out.
#     Build the .app instead and wrap it in the standard `Payload/` layout.
#   * the entitlements are stripped, because `aps-environment` (push) and
#     `com.apple.developer.networking.wifi-info` are not available to a free
#     Apple ID, and would make re-signing fail. Neither is needed to use
#     RustDesk as a controlling device.
#
# The result is UNSIGNED and cannot be installed as-is: re-sign it with your own
# Apple ID (Sideloadly / AltStore / Xcode) on a Mac.

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-for-ios:
    name: aarch64-apple-ios
    needs: [generate-bridge]
    runs-on: macos-latest
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet arm64-ios \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: aarch64-apple-ios

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk lib
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Strip entitlements a free Apple ID cannot sign
        run: |
          cat > flutter/ios/Runner/Runner.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          PLIST
          cat flutter/ios/Runner/Runner.entitlements

      - name: Build rustdesk
        shell: bash
        run: |
          cd flutter
          flutter build ios --release --no-codesign

      - name: Package unsigned ipa
        shell: bash
        run: |
          cd flutter/build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "${{ github.workspace }}/rustdesk-${{ env.VERSION }}-unsigned.ipa" Payload
          cd "${{ github.workspace }}"
          unzip -l "rustdesk-${{ env.VERSION }}-unsigned.ipa" | head -5

      - name: Upload unsigned ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-ios
          path: rustdesk-${{ env.VERSION }}-unsigned.ipa
